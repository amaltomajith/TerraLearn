services:
  - type: web
    name: terralearn-backend
    env: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENAI_MODEL
        value: openai/gpt-oss-120b
      - key: FALLBACK_API_KEY
        sync: false
      - key: FALLBACK_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: FALLBACK_MODEL
        value: meta-llama/llama-3.3-70b-instruct
      # RAG knowledge base — Supabase pgvector + the `embed` edge function.
      # Both values are public/safe (the anon key is already shipped in the frontend bundle).
      - key: SUPABASE_URL
        value: https://qrkjbdvbehvklaqgotrv.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      # --- MCP refresh layer + Farmer MCP server + IVR harness ---
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: AGMARKNET_API_KEY
        sync: false
      - key: MARKET_REFRESH_STATE
        value: Karnataka
      - key: INTERNAL_REFRESH_TOKEN
        sync: false
      # DNS-rebinding allowlist for /mcp/farmer — the actual Render hostname
      # (see .github/workflows/keep-render-awake.yml for the same hostname).
      - key: MCP_ALLOWED_HOSTS
        value: terralearn-n3br.onrender.com
